<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef0f6;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  /* ===== 卡片 ===== */
  .player {
    position: relative;
    width: 480px;
    height: 280px;
    background: #fdfdff;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(90, 100, 180, .18);
    overflow: hidden;
    padding: 22px 26px 34px;
    display: flex;
    gap: 10px;
  }

  /* 背景装饰色块 */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: .55;
    pointer-events: none;
  }
  .blob-1 { width: 260px; height: 260px; background: #dfe4ff; top: -140px; left: -80px; }
  .blob-2 { width: 300px; height: 300px; background: #e6e9fb; bottom: -200px; right: -60px; }
  .blob-3 { width: 180px; height: 180px; background: #d7f0ee; bottom: -110px; left: 30px; }

  /* ===== 左侧信息区 ===== */
  .left {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .title {
    font-size: 19px;
    font-weight: 700;
    color: #3b3f52;
    letter-spacing: .2px;
  }
  .artist {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #4a4e63;
  }
  .meta {
    margin-top: 3px;
    font-size: 12px;
    color: #8a8fa5;
  }

  /* 功能图标行 */
  .actions {
    display: flex;
    gap: 26px;
    margin-top: 22px;
  }
  .actions svg {
    width: 19px; height: 19px;
    stroke: #5b6076;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    cursor: pointer;
    transition: stroke .2s;
  }
  .actions svg:hover { stroke: #7c6cf0; }

  /* 播放控制行 */
  .controls {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: auto;
    margin-bottom: 18px;
  }
  .controls svg {
    width: 18px; height: 18px;
    stroke: #6a6f86;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    cursor: pointer;
  }
  .controls .skip svg { width: 20px; height: 20px; fill: #6a6f86; stroke: none; }

  .btn-pause {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #8f7bff, #6a5df0);
    box-shadow: 0 8px 18px rgba(122, 106, 245, .45);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform .15s;
  }
  .btn-pause:hover { transform: scale(1.06); }
  .btn-pause svg { width: 16px; height: 16px; fill: #fff; }

  /* 进度条 */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: #e2e4ee;
    position: relative;
    cursor: pointer;
  }
  .progress .fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6%;
    border-radius: 2px;
    background: linear-gradient(90deg, #9d8dff, #7a68f5);
  }
  .progress .dot {
    position: absolute;
    left: 6%;
    top: 50%;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #7a68f5;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 3px rgba(122,104,245,.18);
  }
  .time { font-size: 11px; color: #8a8fa5; }

  /* ===== 右侧封面 + 环形频谱 ===== */
  .right {
    position: relative;
    z-index: 2;
    width: 210px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .cover-wrap {
    position: relative;
    width: 150px; height: 150px;
  }
  .cover {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.25), transparent 40%),
      linear-gradient(135deg, #4a4460, #23203a 55%, #38325a);
    box-shadow: inset 0 0 0 5px #fff, 0 10px 24px rgba(60, 60, 120, .25);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .cover .note { font-size: 42px; opacity: .85; filter: drop-shadow(0 3px 4px rgba(0,0,0,.4)); }

  /* 封面下方的柱状频谱 */
  .equalizer {
    width: 170px;
    height: 42px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
  }
  .eq-bar {
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(180deg, #b3a6ff, #8a7bf8);
    transform-origin: bottom;
    animation: eq 1s ease-in-out infinite alternate;
  }
  @keyframes eq {
    from { transform: scaleY(.25); opacity: .65; }
    to   { transform: scaleY(1);  opacity: 1; }
  }

  .all-tracks {
    position: absolute;
    bottom: 9px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    font-size: 9.5px;
    letter-spacing: 2px;
    color: #7d81a0;
    white-space: nowrap;
  }
  .all-tracks::after {
    content: "";
    display: block;
    width: 22px;
    height: 2px;
    background: #c9c4f5;
    margin: 6px auto 0;
    border-radius: 1px;
  }

  /* ===== 播放列表（上滑显示） ===== */
  .left, .right, .all-tracks {
    transition: transform .35s cubic-bezier(.22,.9,.3,1);
  }
  .player.list-open .left,
  .player.list-open .right,
  .player.list-open .all-tracks {
    transform: translateY(-48px);
  }

  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: calc(100% - 42px);
    z-index: 10;
    background: linear-gradient(180deg, #464165 0%, #37324f 100%);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 30px rgba(40, 36, 70, .35);
    transform: translateY(105%);
    transition: transform .35s cubic-bezier(.22,.9,.3,1);
    display: flex;
    flex-direction: column;
    touch-action: none;
    cursor: grab;
    user-select: none;
  }
  .sheet.open { transform: translateY(0); }
  .sheet.dragging { transition: none; cursor: grabbing; }

  .sheet-handle {
    width: 38px; height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,.28);
    margin: 9px auto 4px;
    flex: none;
  }

  .track-list {
    flex: 1;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 78%, transparent 100%);
  }
  .track {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px 20px;
    border-bottom: 1px solid rgba(255,255,255,.05);
    cursor: pointer;
  }
  .t-btn {
    width: 34px; height: 34px;
    flex: none;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.45);
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .t-btn svg { width: 12px; height: 12px; fill: #eceef8; }
  .t-btn .icon-pause { display: none; }

  .track.active .t-btn {
    border: none;
    background: linear-gradient(135deg, #9c8bff, #6f5cf2);
    box-shadow: 0 0 0 4px rgba(140, 122, 250, .25), 0 4px 12px rgba(110, 90, 240, .5);
  }
  .track.active .icon-play { display: none; }
  .track.active .icon-pause { display: block; }

  .t-info { flex: 1; min-width: 0; }
  .t-name { font-size: 13px; font-weight: 600; color: #d9daea; }
  .t-artist { font-size: 11px; color: #8f90ab; margin-top: 2px; }
  .track.active .t-name { color: #fff; }
  .track.active .t-artist { color: #b3aef0; }
  .t-dur { font-size: 11px; color: #a7a8c2; flex: none; }
</style>
<base target="_blank">
</head>
<body>

<div class="player">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- 左侧 -->
  <div class="left">
    <div class="title">Need a Better Future</div>
    <div class="artist">My True Name</div>
    <div class="meta">Drum'n bass &middot; 2016</div>

    <div class="actions">
      <!-- 爱心 -->
      <svg viewBox="0 0 24 24"><path d="M12 20.5C7 16.5 3.5 13.4 3.5 9.6 3.5 7 5.5 5 8 5c1.6 0 3.1.8 4 2.1C12.9 5.8 14.4 5 16 5c2.5 0 4.5 2 4.5 4.6 0 3.8-3.5 6.9-8.5 10.9z"/></svg>
      <!-- 排行榜 -->
      <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      <!-- 下载 -->
      <svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
      <!-- 更多 -->
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="#5b6076" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="#5b6076" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="#5b6076" stroke="none"/></svg>
    </div>

    <div class="controls">
      <!-- 随机播放 -->
      <svg viewBox="0 0 24 24"><path d="M3 7h4l10 10h4M3 17h4M17 7h4"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>
      <!-- 上一首 -->
      <span class="skip"><svg viewBox="0 0 24 24"><path d="M6 5v14M20 5l-11 7 11 7z" stroke="#6a6f86" stroke-width="1.6"/></svg></span>
      <!-- 暂停 -->
      <button class="btn-pause" title="暂停">
        <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>
      <!-- 下一首 -->
      <span class="skip"><svg viewBox="0 0 24 24"><path d="M18 5v14M4 5l11 7-11 7z" stroke="#6a6f86" stroke-width="1.6"/></svg></span>
      <!-- 循环 -->
      <svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3"/><path d="M20 6H8a4 4 0 0 0-4 4v1"/><path d="M7 21l-3-3 3-3"/><path d="M4 18h12a4 4 0 0 0 4-4v-1"/></svg>
    </div>

    <div class="progress-row">
      <div class="progress"><div class="fill"></div><div class="dot"></div></div>
      <div class="time">0:03</div>
    </div>
  </div>

  <!-- 右侧 -->
  <div class="right">
    <div class="cover-wrap">
      <div class="cover"><span class="note">🎵</span></div>
    </div>
    <div class="equalizer" id="equalizer"></div>
  </div>

  <div class="all-tracks">ALL TRACKS</div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="track-list">
      <div class="track">
        <div class="t-btn">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </div>
        <div class="t-info">
          <div class="t-name">Waiting for true love</div>
          <div class="t-artist">The John Smith Band</div>
        </div>
        <div class="t-dur">1:14</div>
      </div>
      <div class="track active">
        <div class="t-btn">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </div>
        <div class="t-info">
          <div class="t-name">Need a Better Future</div>
          <div class="t-artist">My True Name</div>
        </div>
        <div class="t-dur">2:26</div>
      </div>
      <div class="track">
        <div class="t-btn">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </div>
        <div class="t-info">
          <div class="t-name">Vibrations</div>
          <div class="t-artist">Robotics</div>
        </div>
        <div class="t-dur">1:54</div>
      </div>
      <div class="track">
        <div class="t-btn">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </div>
        <div class="t-info">
          <div class="t-name">Why now?</div>
          <div class="t-artist">Night Owl</div>
        </div>
        <div class="t-dur">2:08</div>
      </div>
    </div>
  </div>
</div>

<script>
  // 生成封面下方的柱状频谱
  const eq = document.getElementById('equalizer');
  const N = 28;
  for (let i = 0; i < N; i++) {
    const b = document.createElement('div');
    b.className = 'eq-bar';
    // 中间高、两边低的包络，更像真实均衡器
    const env = Math.sin((i / (N - 1)) * Math.PI);
    const h = 12 + Math.round(env * 26 + Math.random() * 6);
    b.style.height = h + 'px';
    b.style.animationDuration = (0.5 + Math.random() * 0.7).toFixed(2) + 's';
    b.style.animationDelay = (Math.random() * 0.6).toFixed(2) + 's';
    eq.appendChild(b);
  }
</script>

<script>
  // ===== 上滑显示 / 下滑收起播放列表 =====
  const player = document.querySelector('.player');
  const sheet = document.getElementById('sheet');
  let startY = 0, baseY = 0, dragging = false, moved = false;

  const sheetH = () => sheet.offsetHeight;
  const isOpen = () => player.classList.contains('list-open');

  function setOpen(open) {
    player.classList.toggle('list-open', open);
    sheet.classList.toggle('open', open);
    sheet.style.transform = '';
  }

  player.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    startY = e.clientY;
    baseY = isOpen() ? 0 : sheetH();
    dragging = true; moved = false;
  });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dy = e.clientY - startY;
    if (Math.abs(dy) > 5) { moved = true; sheet.classList.add('dragging'); }
    if (!moved) return;
    const y = Math.min(Math.max(baseY + dy, 0), sheetH());
    sheet.style.transform = 'translateY(' + y + 'px)';
  });
  window.addEventListener('pointerup', e => {
    if (!dragging) return;
    dragging = false;
    sheet.classList.remove('dragging');
    if (!moved) return;
    const dy = e.clientY - startY;
    if (isOpen()) setOpen(dy <= 60);
    else setOpen(dy <= -60);
  });

  document.querySelector('.all-tracks').addEventListener('click', () => setOpen(!isOpen()));

  document.querySelectorAll('.track').forEach(row => {
    row.addEventListener('click', () => {
      document.querySelectorAll('.track').forEach(r => r.classList.remove('active'));
      row.classList.add('active');
    });
  });
</script>
</body>
</html>
